name: Metrics
on:
  schedule: [{cron: "0 */12 * * *"}]
  workflow_dispatch:
  push: {branches: ["main", "master"]}

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN || secrets.GITHUB_TOKEN }}
          user: Huzaifa976
          template: classic
          base: header
          config_timezone: Asia/Karachi
          config_padding: 0, 3%

          # Force small, sleek, compact typography
          extras_css: |
            svg { font-size: 10px !important; }
            h1, h1 span { font-size: 14px !important; }
            h2 { font-size: 12px !important; }
            h3 { font-size: 11px !important; }
            .field { font-size: 10px !important; line-height: 1.2 !important; }
            .field svg { transform: scale(0.85); margin: 0 4px !important; }
            text { font-size: 9.5px !important; }

          # 1. 3D Isometric Calendar
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year

          # 2. Most Used Languages Bar
          plugin_languages: yes
          plugin_languages_analysis_timeout: 15
          plugin_languages_categories: markup, programming
          plugin_languages_colors: github
          plugin_languages_limit: 8
          plugin_languages_recent_categories: markup, programming
          plugin_languages_recent_days: 14
          plugin_languages_recent_load: 300
          plugin_languages_sections: most-used
          plugin_languages_threshold: 0%

          # Output SVG
          filename: github-metrics.svg
